<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VÍA VIVA · Sincronía con el video</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/static/icono/viaviva-192.png">
<link rel="apple-touch-icon" href="/static/icono/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fuentes/archivo-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fuentes/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/marca.css">
<link rel="stylesheet" href="/static/estilo.css">
<script src="/tema.js"></script>
<style>
  body { overflow: hidden; }
  .reloj { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; gap: 12px; }
  .hora { font: 700 clamp(48px, 16vw, 200px)/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: -.02em; }
  .ms { font-size: .45em; color: var(--sub); }
  .destello { position: fixed; inset: 0; z-index: 5000; display: grid; place-items: center; background: #fff; color: #000; }
  .destello.negro { background: #000; color: #fff; }
  .destello .hora .ms { color: inherit; }
</style>
</head>
<body>
<main class="reloj">
  <div>
    <div class="sub">Hora UTC del servidor de la captura (filmar al inicio y al final de cada toma)</div>
    <div class="hora" id="hora">--:--:--<span class="ms">.---</span></div>
    <div class="sub" id="local">—</div>
  </div>
  <div style="display:grid;gap:10px;width:min(420px,100%)">
    <button id="b-destello" class="primario boton-grabar">DESTELLO (3 s)</button>
    <p class="ayuda" id="info">Apunte la cámara a esta pantalla y toque DESTELLO. El instante queda guardado en la sesión.</p>
    <a href="/marcar" class="sub">← Volver a marcar</a>
  </div>
</main>
<div id="capa" class="destello oculto"><div class="hora" id="hora2"></div></div>

<script src="/static/comun.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let desfase = 0;           // hora del servidor − hora de este celular (s)

async function medirDesfase() {
  let mejor = null;
  for (let i = 0; i < 5; i++) {
    const t0 = Date.now() / 1000;
    const r = await VV.json('/api/hora');
    const t1 = Date.now() / 1000;
    if (!mejor || t1 - t0 < mejor.rtt) mejor = {rtt: t1 - t0, d: r.utc - (t0 + t1) / 2};
  }
  desfase = mejor.d;
  $('info').textContent = 'Desfase con el servidor ' + (desfase >= 0 ? '+' : '') + desfase.toFixed(3) + ' s (ida y vuelta ' +
    (mejor.rtt * 1000).toFixed(0) + ' ms). Toque DESTELLO con la cámara apuntando aquí.';
}

function texto(t) {
  const d = new Date(t * 1000);
  const p = (n, k) => String(n).padStart(k || 2, '0');
  return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + '<span class="ms">.' +
    p(d.getUTCMilliseconds(), 3) + '</span>';
}

function cuadro() {
  const t = Date.now() / 1000 + desfase;
  $('hora').innerHTML = texto(t); $('hora2').innerHTML = texto(t);
  $('local').textContent = 'Tunja: ' + new Date(t * 1000).toLocaleTimeString('es-CO', {timeZone: 'America/Bogota'});
  requestAnimationFrame(cuadro);
}

$('b-destello').onclick = async () => {
  try {
    const r = await VV.post('/api/destello', {nota: 'pantalla /sync'});
    const capa = $('capa'); capa.classList.remove('oculto');
    if (capa.requestFullscreen) capa.requestFullscreen().catch(() => {});
    const fin = Date.now() + 3000;
    const iv = setInterval(() => { capa.classList.toggle('negro'); if (Date.now() > fin) { clearInterval(iv);
      capa.classList.add('oculto'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } }, 250);
    VV.aviso('Destello guardado: ' + r.destello.utc.slice(11, 23) + ' UTC', 'ok');
  } catch (e) {
    if (e.codigo === 401 || e.codigo === 403) location.href = '/marcar'; else VV.aviso(e.message, 'mal');
  }
};

medirDesfase().catch(() => { $('info').textContent = 'Sin conexión con la captura.'; });
requestAnimationFrame(cuadro);
</script>
</body>
</html>
