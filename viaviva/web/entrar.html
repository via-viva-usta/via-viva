<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VÍA VIVA · Entrar</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/static/icono/viaviva-192.png">
<link rel="apple-touch-icon" href="/static/icono/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fuentes/archivo-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fuentes/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/marca.css">
<link rel="stylesheet" href="/static/estilo.css">
<script src="/tema.js"></script>
</head>
<body>
<main class="entrar">
  <section class="tarjeta">
    <a class="marca logo-texto" href="/" title="Inicio">Vía<i>·</i>Viva</a>
    <form id="f">
      <label>Usuario <input id="usuario" autocomplete="username" autocapitalize="none" required></label>
      <label>Contraseña <input id="clave" type="password" autocomplete="current-password" required></label>
      <button class="primario" type="submit">Entrar</button>
      <p id="error" class="aviso rojo oculto"></p>
      <p id="sin-usuarios" class="aviso oculto">Todavía no hay usuarios. En la consola de la Pi:
        <code>python -m viaviva.usuarios crear &lt;usuario&gt; --rol editor</code></p>
    </form>
    <p class="ayuda">Equipo: captura y edición. Alcaldía y docentes: tablero de solo lectura.</p>
  </section>
</main>
<script src="/static/comun.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let siguiente = new URLSearchParams(location.search).get('siguiente') || '/';
if (!/^\/(?!\/)/.test(siguiente)) siguiente = '/';          // solo rutas de este sitio
VV.json('/api/yo').then(r => {
  if (r.sin_usuarios) $('sin-usuarios').classList.remove('oculto');
  if (r.usuario) location.href = r.usuario.rol === 'editor' ? siguiente : '/tablero';
}).catch(() => {});
$('f').onsubmit = async (ev) => {
  ev.preventDefault();
  $('error').classList.add('oculto');
  try {
    const r = await VV.post('/api/entrar', {usuario: $('usuario').value, clave: $('clave').value});
    location.href = r.usuario.rol === 'editor' ? (siguiente.startsWith('/') ? siguiente : '/') : '/tablero';
  } catch (e) { $('error').textContent = e.message; $('error').classList.remove('oculto'); $('clave').value = ''; }
};
</script>
</body>
</html>
