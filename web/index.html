<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VÍA VIVA · Mapa de vías de Tunja</title>
<meta name="description" content="Mapa público de VÍA VIVA: riesgo de huecos por tramo, reportes ciudadanos y eventos detectados en Tunja.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --asfalto:#2f2f2f; --senal:#f2c230; --verde:#2a9d8f; --fondo:#f4f3ef; --texto:#1f1f1f; --aviso:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--asfalto); color: #fff; }
  header h1 { margin: 0; font-size: 1.1rem; letter-spacing: .02em; }
  header .lema { opacity: .8; font-size: .85rem; }
  #aviso { display: none; padding: 8px 16px; background: var(--aviso); color: #fff; font-weight: 600; font-size: .9rem; }
  #mapa { position: absolute; top: 48px; bottom: 0; left: 0; right: 0; }
  body.con-aviso #mapa { top: 84px; }
  .panel { background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 10px; box-shadow: 0 1px 4px #0003;
           font-size: .82rem; line-height: 1.35; max-width: 250px; }
  .panel h3 { margin: 0 0 6px; font-size: .9rem; }
  .fila { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .linea { width: 28px; border-radius: 2px; flex: none; }
  .punto { width: 12px; height: 12px; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px #0006; }
  .nota { color: #555; font-size: .75rem; margin-top: 6px; }
  @media (max-width: 600px) { header .lema { display: none; } .panel { max-width: 190px; font-size: .75rem; } }
</style>
</head>
<body>
<header><h1>VÍA VIVA</h1><span class="lema">Las calles de Tunja, en tiempo real</span></header>
<div id="aviso"></div>
<div id="mapa" role="application" aria-label="Mapa de Tunja con riesgo de huecos, reportes y eventos"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="datos.js"></script>
<script>
(function () {
  const D = window.VIA_VIVA;
  const mapa = L.map("mapa", { preferCanvas: true });
  mapa.fitBounds([[5.505, -73.385], [5.575, -73.340]]);   // zona urbana de Tunja
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  }).addTo(mapa);
  mapa.attributionControl.addAttribution("VÍA VIVA · USTA Tunja");

  if (!D) {
    mostrarAviso("Faltan los datos: corre web/exportar.py para generar datos.js.");
    return;
  }
  if (D.corrida && D.corrida.demo) {
    mostrarAviso("DEMO: el riesgo de este mapa se calculó con etiquetas INVENTADAS para probar el sistema. No es un resultado.");
  }

  // ---- Tramos coloreados por quintil de riesgo (color y grosor: legible con daltonismo) ----
  const COLORES = ["#f6d55c", "#f3a33a", "#e9672b", "#c8331f", "#7f0d1e"];
  const GROSOR = [1.5, 2, 2.6, 3.4, 4.4];
  const valores = D.tramos.features.map(f => f.properties.r).filter(r => r !== null).sort((a, b) => a - b);
  const cortes = [1, 2, 3, 4].map(i => valores[Math.min(valores.length - 1, Math.floor(i * valores.length / 5))]);
  const clase = r => (r === null || !valores.length) ? -1 : cortes.filter(c => r >= c).length;
  const capaTramos = L.geoJSON(D.tramos, {
    style: f => {
      const c = clase(f.properties.r);
      return c < 0 ? { color: "#9e9e9e", weight: 1, opacity: .6 } : { color: COLORES[c], weight: GROSOR[c], opacity: .9 };
    },
    onEachFeature: (f, capa) => {
      const p = f.properties;
      capa.bindPopup(`<b>${p.n || "Calle sin nombre"}</b><br>Tipo: ${p.t || "—"}<br>` +
        (p.r === null ? "Riesgo: sin calcular" : `Riesgo de hueco no reportado: <b>${(p.r * 100).toFixed(0)} %</b>`) +
        `<br><span style="color:#666">Tramo ${p.id}</span>`);
    }
  }).addTo(mapa);

  // ---- Reportes ciudadanos (forma de rombo, color por estado) ----
  const COLOR_ESTADO = { nuevo: "#b3261e", confirmado: "#e9672b", en_reparacion: "#1f78b4", reparado: "#2a9d8f" };
  const NOMBRE_ESTADO = { nuevo: "nuevo", confirmado: "confirmado", en_reparacion: "en reparación", reparado: "reparado" };
  const icono = color => L.divIcon({ className: "", iconSize: [16, 16],
    html: `<div style="width:12px;height:12px;background:${color};transform:rotate(45deg);border:2px solid #fff;box-shadow:0 0 0 1px #0007"></div>` });
  const capaReportes = L.geoJSON(D.reportes, {
    pointToLayer: (f, ll) => L.marker(ll, { icon: icono(COLOR_ESTADO[f.properties.estado] || "#555"),
                                            title: `Reporte ${f.properties.id}` }),
    onEachFeature: (f, capa) => capa.bindPopup(`<b>Reporte #${f.properties.id}</b><br>${f.properties.tipo}<br>` +
      `Estado: <b>${NOMBRE_ESTADO[f.properties.estado] || f.properties.estado}</b><br>${f.properties.fecha}`)
  }).addTo(mapa);

  // ---- Eventos detectados (círculos) ----
  const capaEventos = L.geoJSON(D.eventos, {
    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5, color: "#fff", weight: 1.5, fillColor: "#2f2f2f", fillOpacity: .9 }),
    onEachFeature: (f, capa) => capa.bindPopup(`<b>${f.properties.clase.replace("_", " ")}</b><br>` +
      `Detectado por: ${f.properties.origen}<br>${f.properties.fecha}`)
  }).addTo(mapa);

  L.control.layers(null, { "Riesgo por tramo": capaTramos, "Reportes ciudadanos": capaReportes, "Eventos detectados": capaEventos },
                   { collapsed: window.innerWidth < 600 }).addTo(mapa);

  // ---- Leyenda ----
  const leyenda = L.control({ position: "bottomleft" });
  leyenda.onAdd = () => {
    const div = L.DomUtil.create("div", "panel");
    let html = "<h3>Riesgo de hueco no reportado</h3>";
    if (valores.length) {
      for (let c = 4; c >= 0; c--) {
        const lo = c === 0 ? valores[0] : cortes[c - 1], hi = c === 4 ? valores[valores.length - 1] : cortes[c];
        html += `<div class="fila"><span class="linea" style="background:${COLORES[c]};height:${GROSOR[c] + 1}px"></span>` +
                `${(lo * 100).toFixed(0)}–${(hi * 100).toFixed(0)} %</div>`;
      }
    }
    html += `<div class="fila"><span class="linea" style="background:#9e9e9e;height:2px"></span>Sin calcular</div>`;
    html += "<h3 style='margin-top:8px'>Reportes (rombos)</h3>";
    for (const e of Object.keys(COLOR_ESTADO)) {
      html += `<div class="fila"><span class="punto" style="background:${COLOR_ESTADO[e]};transform:rotate(45deg)"></span>${NOMBRE_ESTADO[e]}</div>`;
    }
    html += `<div class="fila"><span class="punto" style="background:#2f2f2f;border-radius:50%"></span>Evento detectado</div>`;
    html += `<div class="nota">${D.reportes.features.length} reportes · ${D.eventos.features.length} eventos · ` +
            `datos del ${D.generado.slice(0, 10)}` +
            (D.corrida ? `<br>Modelo: ${D.corrida.modelo} (${D.corrida.version})` + (D.corrida.fuente ? `<br>Etiquetas: ${D.corrida.fuente}` : "") : "<br>Aún no hay modelo de riesgo") +
            "<br>Las fotos de los reportes no se publican.</div>";
    div.innerHTML = html;
    return div;
  };
  leyenda.addTo(mapa);

  function mostrarAviso(texto) {
    const a = document.getElementById("aviso");
    a.textContent = texto;
    a.style.display = "block";
    document.body.classList.add("con-aviso");
    mapa.invalidateSize();
  }
})();
</script>
</body>
</html>
