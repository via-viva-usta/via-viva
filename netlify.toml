# Tablero en línea de VÍA VIVA: carpeta estática, sin compilación. Antes de publicar: `viaviva nube preparar`.
[build]
  publish = "web/en_linea"
  command = ""

# 'wasm-unsafe-eval': el visor 3D del menú (model-viewer / three.js) compila WebAssembly. Solo permite WebAssembly,
# NO el eval de JavaScript. Sin él, los modelos cargan igual pero la consola marca el error de CSP.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' https://tiles.openfreemap.org; connect-src 'self' https://*.supabase.co https://tiles.openfreemap.org https://cdn.jsdelivr.net https://cdn.sheetjs.com; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-ancestors 'none'"

[[headers]]
  for = "/datos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Portada y tablero: fuentes locales (web/en_linea/fuentes, OFL) e imágenes de la portada
[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/modelos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
