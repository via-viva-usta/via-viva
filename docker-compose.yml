# VÍA VIVA · plan B en Docker (solo captura del PC con phyphox). SIN PROBAR: en el PC donde se armó no había Docker.
# El camino principal sigue siendo el nativo (SALIDA_DE_CAMPO.cmd en Windows). La Pi no usa Docker.
#
#   docker compose build                                   una vez, con internet
#   docker compose run --rm viaviva doctor                 pre-chequeo (conectado al WiFi del iPhone)
#   docker compose run --rm viaviva doctor --simulado ejemplo        sin iPhone
#   docker compose run --rm --service-ports viaviva capture --replay ejemplo --por-http   práctica
#   docker compose up                                      captura real → http://localhost:8000/captura (Ctrl+C cierra)
#
# Variables opcionales (en la consola o en el .env de esta carpeta; nunca claves en este archivo):
#   VIAVIVA_PHYPHOX_URL, VIAVIVA_PIN, VIAVIVA_IP_PC (IP del PC para el celular), VIAVIVA_SESIONES_PC (carpeta del PC)
services:
  viaviva:
    build: .
    image: viaviva-captura
    # Red «bridge» por defecto (172.17.x): una red de compose podría caer en 172.20.x y tapar el iPhone (172.20.10.1)
    network_mode: bridge
    ports:
      - "${VIAVIVA_PUERTO_PC:-8000}:8000"
    environment:
      VIAVIVA_PHYPHOX_URL: ${VIAVIVA_PHYPHOX_URL:-http://172.20.10.1}
      VIAVIVA_PIN: ${VIAVIVA_PIN:-}
      VIAVIVA_IP_PC: ${VIAVIVA_IP_PC:-}
      # Docker oculta la IP real: quien entre por el puerto publicado (este PC y los celulares del hotspot) queda como
      # editor mientras no haya usuarios. En el WiFi del iPhone solo está el equipo. Para cerrarlo:
      #   docker compose run --rm viaviva usuarios crear <usuario> --rol editor
      VIAVIVA_IPS_EDITOR: ${VIAVIVA_IPS_EDITOR:-172.17.0.0/16,192.168.65.0/24}
    volumes:
      - ${VIAVIVA_SESIONES_PC:-./data/sesiones_docker}:/sesiones
      - viaviva-datos:/app/data
    stdin_open: true
    tty: true
    stop_grace_period: 20s
    command: ["capture"]

volumes:
  viaviva-datos:
