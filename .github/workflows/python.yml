# Pruebas de Python (pytest). Solo corre si cambian esas carpetas; caché de pip; cancela corridas viejas de la misma rama.
name: python
on:
  push:
    branches: [main]
    paths: ["dataset/**", "analysis/**", "etl/**", "herramientas/**", "risk_model/**", "pi/**", "futuro/bot/**", "db/**", "tests/**",
            "pytest.ini", ".github/workflows/python.yml"]
  pull_request:
    paths: ["dataset/**", "analysis/**", "etl/**", "herramientas/**", "risk_model/**", "pi/**", "futuro/bot/**", "db/**", "tests/**",
            "pytest.ini", ".github/workflows/python.yml"]
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: pytest
