; VÍA VIVA — nodo de sensores
; Placa: ESP32-S3-DevKitC-1 N16R8 (16 MB flash QIO, 8 MB PSRAM octal)
;
; Compilar:  pio run
; Subir:     pio run -t upload        (cable en el puerto "UART" de la placa)
; Monitor:   pio device monitor
;
; Elegir el modo de adquisición del experimento E1 con -DMODO_ADQ=0|1|2 (ver include/config.h)

[platformio]
default_envs = esp32s3

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    pololu/VL53L0X @ 1.3.1
    mikalhart/TinyGPSPlus @ 1.1.0

[s3_n16r8]
board = esp32-s3-devkitc-1
; N16R8: flash QIO + PSRAM octal (OPI). Con PSRAM octal los GPIO 35-37 quedan ocupados.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 (GPIO 43/44, puerto "UART" de la placa)
    -DCORE_DEBUG_LEVEL=1

; Modo normal: FIFO + DMA ping-pong
[env:esp32s3]
extends = s3_n16r8
build_flags = ${s3_n16r8.build_flags} -DMODO_ADQ=2

; Variantes para el experimento E1 (mismo código, otro modo de adquisición)
[env:e1_polling]
extends = s3_n16r8
build_flags = ${s3_n16r8.build_flags} -DMODO_ADQ=0

[env:e1_int_muestra]
extends = s3_n16r8
build_flags = ${s3_n16r8.build_flags} -DMODO_ADQ=1
