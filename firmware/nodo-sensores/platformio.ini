; VÍA VIVA — nodo de sensores
; Placa: ESP32 DevKit de 30 pines (ESP32-WROOM-32: 4 MB flash, sin PSRAM)
;
; Compilar:  pio run
; Subir:     pio run -t upload
; Monitor:   pio device monitor
;
; El modo de adquisición del experimento E1 se elige con el entorno (ver include/config.h).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv   ; más espacio para la aplicación (servidor web + modelos)
lib_deps =
    pololu/VL53L0X @ 1.3.1
    mikalhart/TinyGPSPlus @ 1.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Modo normal: FIFO + DMA ping-pong
[env:esp32dev]
build_flags = ${env.build_flags} -DMODO_ADQ=2

; Variantes del experimento E1 (mismo código, otro modo de adquisición)
[env:e1_polling]
build_flags = ${env.build_flags} -DMODO_ADQ=0

[env:e1_int_muestra]
build_flags = ${env.build_flags} -DMODO_ADQ=1
