; VÍA VIVA — programas de prueba, uno por sensor (ESP32 DevKit, esp32dev).
; Cada entorno compila UN archivo de src/. Ver docs/montaje.md para el orden de prueba.
;
;   pio run -e i2c -t upload && pio device monitor       (escáner I2C)
;   pio run -e adxl345 -t upload && pio device monitor
;   ... (mpu6050, vl53l0x, gps, microsd, boton_led, bme280, dht22, bh1750)
;
; Cada programa imprime por el monitor serie (115200) una línea "RESULTADO: PASA" o "RESULTADO: FALLA (motivo)".

[platformio]
default_envs = i2c, adxl345, mpu6050, vl53l0x, gps, microsd, boton_led, bme280, dht22, bh1750

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../include          ; usa include/pines.h del nodo: los mismos pines

[env:i2c]
build_src_filter = +<prueba_i2c.cpp>

[env:adxl345]
build_src_filter = +<prueba_adxl345.cpp>

[env:mpu6050]
build_src_filter = +<prueba_mpu6050.cpp>

[env:vl53l0x]
build_src_filter = +<prueba_vl53l0x.cpp>
lib_deps = pololu/VL53L0X @ 1.3.1

[env:gps]
build_src_filter = +<prueba_gps.cpp>
lib_deps = mikalhart/TinyGPSPlus @ 1.1.0

[env:microsd]
build_src_filter = +<prueba_microsd.cpp>

[env:boton_led]
build_src_filter = +<prueba_boton_led.cpp>

; Ambiente (include/ambiente.h): DHT22 (el que se compró) y BH1750; BME280 solo si algún día se pone uno
[env:bme280]
build_src_filter = +<prueba_bme280.cpp>

[env:dht22]
build_src_filter = +<prueba_dht22.cpp>

[env:bh1750]
build_src_filter = +<prueba_bh1750.cpp>
