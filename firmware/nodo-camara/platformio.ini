; VÍA VIVA — nodo de cámara
; Placa: ESP32-CAM AI-Thinker (ESP32 + OV2640 + 4 MB PSRAM)
;
; Compilar:  pio run
; Subir:     con adaptador USB-serie (FTDI/CH340): GPIO 0 a GND al encender, luego pio run -t upload

[env:esp32cam]
platform = espressif32 @ 6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
